# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
# Run locally with: cargo deny check

[graph]
all-features = true

[advisories]
# RustSec advisory database. Vulnerable or yanked crates fail the build.
version = 2
# Only flag *unmaintained* advisories for crates we depend on directly; deep
# transitive unmaintained crates often have no safe upgrade available.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. Anything not listed here fails the build; add an
# entry deliberately when a new transitive license shows up.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
]

[bans]
# Duplicate versions are common in transitive trees; warn rather than fail.
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates (e.g. examples/demo) use path dependencies.
allow-wildcard-paths = true

[sources]
# Only crates.io is permitted; no git or alternate-registry sources.
unknown-registry = "deny"
unknown-git = "deny"
