name: Publish

# Publishes fluorite to crates.io and npm on version tags (vX.Y.Z), plus a
# GitHub Release carrying the per-platform binaries.
#
# crates.io uses Trusted Publishing (OIDC) — no long-lived token. One-time
# setup per crate on crates.io: crate Settings -> Trusted Publishing -> GitHub,
# repository blossomstack/fluorite, workflow publish.yml. Until that's configured
# (or on a brand-new crate's first publish) it falls back to the CRATES_IO_TOKEN
# repo secret.
#
# npm likewise uses Trusted Publishing (OIDC). One-time setup per package on
# npmjs.com: package Settings -> Trusted Publisher -> GitHub Actions, repository
# blossomstack/fluorite, workflow publish.yml. The package must already exist on npm
# to configure this, so a brand-new package's first publish needs a token; all
# six current packages already exist. Unlike crates.io there is no token
# fallback here — every published package must have a trusted publisher set up.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned Rust toolchain — keep in sync with ci.yml.
  RUST_TOOLCHAIN: "1.96.0"

# Least privilege by default; jobs that write the GitHub Release or mint an OIDC
# token widen this locally.
permissions:
  contents: read

jobs:
  # Publish every publishable workspace crate to crates.io via OIDC.
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token exchanged for a temp crates.io token
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          shared-key: release

      - name: Authenticate with crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.4
        # First-ever publish has no trusted-publishing config yet; fall through
        # to the token secret below instead of failing the run.
        continue-on-error: true

      # Publish each publishable member (derived from cargo metadata, so new
      # crates are picked up automatically), skipping versions the registry
      # already has. Multiple passes resolve dependency order: a crate whose
      # deps aren't published yet fails its pass and succeeds in a later one.
      # This sidesteps a cargo 1.96 `--workspace` publish bug where the
      # index-confirmation loop desyncs mid-chain ("no packages ready to publish
      # but N remain in plan"), and makes reruns resumable.
      - name: cargo publish
        run: |
          mapfile -t pkgs < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish == null) | "\(.name) \(.version)"')
          # +1 ensures a final verification pass where remaining=0 exits cleanly
          # even when the last crate publishes in the Nth pass.
          for pass in $(seq 1 $((${#pkgs[@]} + 1))); do
            progress=0 remaining=0
            for pkg in "${pkgs[@]}"; do
              name=${pkg% *} version=${pkg#* }
              if curl -fsS -A "publish-workflow (github.com/${{ github.repository }})" \
                  "https://crates.io/api/v1/crates/$name/$version" >/dev/null 2>&1; then
                continue
              fi
              remaining=1
              if cargo publish -p "$name" --locked; then progress=1; fi
            done
            [ "$remaining" = 0 ] && exit 0
            [ "$progress" = 0 ] && { echo "no progress in pass $pass"; exit 1; }
          done
          echo "crates still unpublished after ${#pkgs[@]} passes"; exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CRATES_IO_TOKEN }}
          # The runner hits spurious HTTP/2 broken-pipe errors against crates.io,
          # which desync cargo's wait-for-publish loop. HTTP/1.1 and a longer
          # confirmation window keep chained publishes alive.
          CARGO_HTTP_MULTIPLEXING: "false"
          CARGO_PUBLISH_TIMEOUT: "300"

  # Build a binary per platform, attach it to the GitHub Release, and stash the
  # per-platform npm package as an artifact for the publish-npm-* jobs.
  build-and-release:
    name: Build ${{ matrix.target }}
    # Binaries/release/npm only make sense for a version tag; a workflow_dispatch
    # rerun (on a branch ref) just re-runs the idempotent crates publish above.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # create the GitHub Release and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: fluorite
            npm_package: fluorite-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm # native arm runner — no cross-compilation
            artifact_name: fluorite
            npm_package: fluorite-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest # cross-compiled from arm; Intel runners are being retired
            artifact_name: fluorite
            npm_package: fluorite-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: fluorite
            npm_package: fluorite-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: fluorite.exe
            npm_package: fluorite-win32-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          key: ${{ matrix.target }}
          shared-key: release

      - name: Build binary
        run: cargo build --locked --release --package fluorite_codegen --target ${{ matrix.target }}

      - name: Prepare npm package
        shell: bash
        run: |
          mkdir -p npm/${{ matrix.npm_package }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} npm/${{ matrix.npm_package }}/bin/
          # Ensure binary has execute permission (required for Unix platforms).
          chmod +x npm/${{ matrix.npm_package }}/bin/${{ matrix.artifact_name }} 2>/dev/null || true

      - name: Upload npm package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.npm_package }}
          path: npm/${{ matrix.npm_package }}

      - name: Upload binary to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="fluorite-${{ matrix.target }}"
          [[ "${{ matrix.artifact_name }}" == *.exe ]] && asset="${asset}.exe"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$asset"
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          # First matrix job to arrive creates the release; the rest just upload.
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --generate-notes $prerelease 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

  # Publish the per-platform npm packages via OIDC trusted publishing.
  publish-npm-platforms:
    name: Publish npm (${{ matrix.npm_package }})
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing to npm
      contents: read
    strategy:
      fail-fast: false
      matrix:
        npm_package:
          - fluorite-darwin-x64
          - fluorite-darwin-arm64
          - fluorite-linux-x64
          - fluorite-linux-arm64
          - fluorite-win32-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 24 ships 11.x but pin latest
      # to be safe.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Download npm package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.npm_package }}
          path: npm/${{ matrix.npm_package }}

      - name: Publish to npm
        working-directory: npm/${{ matrix.npm_package }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version
          name=$(node -p "require('./package.json').name")
          # Idempotent: skip if this version is already on the registry so a
          # rerun after a partial failure doesn't 403.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
          else
            npm publish --access public
          fi

  # Publish the main fluorite-cli npm package (after the platform packages).
  publish-npm-main:
    name: Publish npm (fluorite-cli)
    needs: publish-npm-platforms
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing to npm
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        working-directory: npm/fluorite-cli
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version
          # Pin every optionalDependency (the platform packages) to this version.
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = v;
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$version"
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
          else
            npm publish --access public
          fi
