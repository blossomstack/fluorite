version: 2
updates:
  # Rust crate dependencies across the workspace.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
      time: "18:00"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 10
    groups:
      cargo-routine:
        # Group routine minor/patch updates into a single daily PR.
        update-types:
          - minor
          - patch
        # Breaking-prone libraries are excluded so they arrive as individual,
        # reviewable PRs. These are 0.x crates whose "minor" bumps are de-facto
        # breaking, so update-type filtering alone won't isolate them.
        exclude-patterns:
          - "chumsky"
          - "askama"
          - "logos"
          - "ariadne"
    # Semver-major updates (e.g. clap 4 -> 5) are not covered by the group
    # above, so they open as individual PRs automatically.

  # Keeps the SHA-pinned GitHub Actions current (bumps both the pin and the
  # trailing # vX.Y.Z version comment) across ci.yml and release.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "18:00"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 5
    groups:
      all-actions:
        patterns:
          - "*"

  # npm dependencies used by the TypeScript interop tests / demo.
  - package-ecosystem: npm
    directory: "/examples/demo-ts"
    schedule:
      interval: daily
      time: "18:00"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 5
    groups:
      npm-dev:
        patterns:
          - "*"
        # Breaking-prone dev majors come as individual, reviewable PRs (e.g.
        # typescript 6 / @types/node 25 require tsconfig changes to build).
        exclude-patterns:
          - "typescript"
          - "@types/node"
  - package-ecosystem: npm
    directory: "/codegen/tests/ts_e2e"
    schedule:
      interval: daily
      time: "18:00"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 5
    groups:
      npm-dev:
        patterns:
          - "*"
        # Breaking-prone dev majors come as individual, reviewable PRs (e.g.
        # typescript 6 / @types/node 25 require tsconfig changes to build).
        exclude-patterns:
          - "typescript"
          - "@types/node"
