---
configs:
  rust_package: "demo"
types:
  - name: User
    type: Object
    fields:
      - name: first_name
        type: String
      - name: last_name
        type: String
      - name: age
        type: UInt32
      - name: gender
        type: Gender
      - name: active
        type: Bool
      - name: info
        type: Any
        optional: true
    configs:
      rename_all: camelCase
  
  - name: Gender
    type: Enum
    values:
      - Male
      - Female

  - name: TestUnion
    type: Union
    type_tag: type
    values:
      - PlainString
      - AnObject
    configs:
      union_style: Extern 

  - name: AnObject
    type: Object
    fields:
      - name: field_a
        type: String
    configs:
      rename_all: camelCase
